<svg width="128" height="128" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Sort &#x26; Unique Lines icon</title>
  <!-- Sort Bars (Ink #141414) -->
  <path d="M3.5 6.5H10.5" stroke="#141414" stroke-width="1.25" stroke-linecap="square"/>
  <path d="M3.5 11.5H8.5" stroke="#141414" stroke-width="1.25" stroke-linecap="square"/>
  <path d="M3.5 16.5H6.5" stroke="#141414" stroke-width="1.25" stroke-linecap="square"/>

  <!-- Corrected Sort Direction Arrow (Ultramarine Accent #2400ff) -->
  <!-- Vertical Stem: Ends at Y=15.875 so its square cap (+0.625px) aligns cleanly inside the arrowhead vertex -->
  <path d="M12.5 5.5V15.875" stroke="#2400ff" stroke-width="1.25" stroke-linecap="square"/>
  <!-- Arrowhead Chevron: Single continuous path with miter join at the tip -->
  <path d="M10.5 14.5L12.5 16.5L14.5 14.5" stroke="#2400ff" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Geometric Filter Funnel (Ink #141414) -->
  <path d="M16.5 6.5H21.5L19.5 11.5V17.5L18 16.5V11.5L16.5 6.5Z" stroke="#141414" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
